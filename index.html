<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DorsalRun — Generador de Dorsal</title>
  <meta name="description" content="Creá tu dorsal personalizado con tu nombre y número. Descargalo como imagen para compartir antes de tu carrera." />
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#e63946" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700;900&family=Space+Mono:wght@700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1117;
      --surface: #161b22;
      --surface2:#1e252d;
      --surface3:#252d38;
      --border:  rgba(255,255,255,.08);
      --accent:  #e63946;
      --text:    #e6edf3;
      --muted:   #7d8590;
      --radius:  14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
    }

    /* ── HEADER ── */
    header {
      background: linear-gradient(160deg, #1a0a0d 0%, #0d1117 70%);
      border-bottom: 1px solid var(--border);
      padding: 26px 24px 22px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 80% at 50% 0%, rgba(230,57,70,.14) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-icon { font-size: 42px; margin-bottom: 6px; }
    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(38px, 9vw, 56px);
      letter-spacing: 4px;
      color: #fff;
      line-height: 1;
    }
    header h1 span { color: var(--accent); }
    header p {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin-top: 6px;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
    }

    /* ── LAYOUT ── */
    .layout {
      max-width: 900px;
      margin: 0 auto;
      padding: 24px 16px 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
    }
    @media (max-width: 640px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── PREVIEW ── */
    .preview-col { position: sticky; top: 20px; }
    .canvas-wrapper {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      text-align: center;
    }
    #dorsalCanvas {
      border-radius: 8px;
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      box-shadow: 0 8px 40px rgba(0,0,0,.6);
    }
    .btn-download {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity .18s, transform .12s;
    }
    .btn-download:hover { opacity: .88; transform: translateY(-1px); }
    .btn-download:active { transform: translateY(0); }
    .share-tip {
      margin-top: 10px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-align: center;
    }

    /* ── FORM ── */
    .form-col { display: flex; flex-direction: column; gap: 16px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .card-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
      text-transform: uppercase;
      font-family: 'Space Mono', monospace;
      margin-bottom: 12px;
    }

    /* inputs */
    .field { margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-family: 'Space Mono', monospace;
    }
    .field input[type="text"],
    .field input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--text);
      font-size: 16px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus { border-color: var(--accent); }
    .field input[type="number"] {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    /* templates */
    .templates-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .tpl-btn {
      border-radius: 10px;
      border: 2px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      padding: 10px 4px 8px;
      text-align: center;
      transition: all .18s;
    }
    .tpl-btn .tpl-preview {
      width: 100%;
      aspect-ratio: 4/5;
      border-radius: 6px;
      display: block;
      margin-bottom: 6px;
    }
    .tpl-btn .tpl-name {
      font-size: 10px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .tpl-btn.active { border-color: var(--accent); }
    .tpl-btn.active .tpl-name { color: var(--accent); }

    /* color row */
    .color-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid transparent;
      transition: transform .15s, border-color .15s;
      flex-shrink: 0;
    }
    .color-swatch:hover { transform: scale(1.15); }
    .color-swatch.active { border-color: #fff; transform: scale(1.15); }

    /* ── IMAGE / LOGO UPLOAD ── */
    .btn-upload-img {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 2px dashed var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      transition: border-color .18s, color .18s;
      text-align: center;
      letter-spacing: .5px;
    }
    .btn-upload-img:hover { border-color: var(--accent); color: var(--accent); }
    .img-preview-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin: 10px 0 8px;
    }
    #imgThumb {
      width: 68px; height: 68px;
      object-fit: cover;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .img-actions { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .logo-toggle { cursor: pointer; }
    .logo-toggle input[type=checkbox] { display: none; }
    .logo-toggle-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      cursor: pointer;
      transition: all .18s;
      user-select: none;
      line-height: 1.3;
    }
    .logo-toggle input:checked + .logo-toggle-label {
      border-color: var(--accent);
      color: var(--accent2, #fff);
      background: rgba(0,201,107,.13);
    }
    .chk-icon { font-size: 12px; opacity: .25; transition: opacity .15s; font-style: normal; }
    .logo-toggle input:checked + .logo-toggle-label .chk-icon { opacity: 1; }
    .btn-clear-img {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      padding: 2px 0;
      text-align: left;
      transition: color .15s;
    }
    .btn-clear-img:hover { color: #e63946; }
    .frase-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .frase-btn {
      padding: 5px 13px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--surface2);
      color: var(--muted);
      font-size: 11px;
      font-family: 'Space Mono', monospace;
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      letter-spacing: .5px;
    }
    .frase-btn:hover { border-color: var(--accent); color: var(--accent); }
    .frase-btn.active { border-color: var(--accent); background: rgba(0,201,107,.15); color: var(--accent); }
    .extracted-label {
      font-size: 10px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .no-colors-msg { font-size: 11px; color: var(--muted); font-family: 'Space Mono', monospace; }

    footer {
      text-align: center;
      padding: 18px;
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="header-icon">🏅</div>
  <h1>DORSAL<span>RUN</span></h1>
  <p>Generador de dorsal personalizado</p>
</header>

<div class="layout">

  <!-- PREVIEW -->
  <div class="preview-col">
    <div class="canvas-wrapper">
      <canvas id="dorsalCanvas" width="400" height="520"></canvas>
      <button class="btn-download" id="btnDownload">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 16l-5-5 1.41-1.41L11 13.17V4h2v9.17l2.59-2.58L17 11zm-7 4h14v2H5z"/></svg>
        DESCARGAR PNG
      </button>
      <p class="share-tip">📸 Compartí en redes antes de tu carrera</p>
    </div>
  </div>

  <!-- FORM -->
  <div class="form-col">

    <div class="card">
      <div class="card-label">🔢 Número y nombre</div>
      <div class="field">
        <label>Número de dorsal</label>
        <input type="number" id="inpNumero" value="42" min="1" max="99999" maxlength="5" />
      </div>
      <div class="field">
        <label>Tu nombre</label>
        <input type="text" id="inpNombre" value="ARIEL SAVINI" maxlength="22" placeholder="TU NOMBRE" />
      </div>
      <div class="field">
        <label>Nombre del evento (opcional)</label>
        <input type="text" id="inpEvento" value="TRAIL DE LOS ANDES" maxlength="28" placeholder="MI CARRERA 2026" />
      </div>
    </div>

    <div class="card">
      <div class="card-label">🎨 Diseño</div>
      <div class="templates-grid" id="templatesGrid">
        <div class="tpl-btn active" data-tpl="trail">
          <canvas class="tpl-preview" id="prev-trail" width="80" height="100"></canvas>
          <div class="tpl-name">Trail</div>
        </div>
        <div class="tpl-btn" data-tpl="road">
          <canvas class="tpl-preview" id="prev-road" width="80" height="100"></canvas>
          <div class="tpl-name">Road</div>
        </div>
        <div class="tpl-btn" data-tpl="ultra">
          <canvas class="tpl-preview" id="prev-ultra" width="80" height="100"></canvas>
          <div class="tpl-name">Ultra</div>
        </div>
        <div class="tpl-btn" data-tpl="clasico">
          <canvas class="tpl-preview" id="prev-clasico" width="80" height="100"></canvas>
          <div class="tpl-name">Clásico</div>
        </div>
      </div>
      <div class="card-label" style="margin-top:14px;margin-bottom:6px">🏷️ Frase</div>
      <div class="frase-row" id="fraseRow">
        <button class="frase-btn active" data-frase="TRAIL RUNNER">TRAIL</button>
        <button class="frase-btn" data-frase="RUNNING">RUNNING</button>
        <button class="frase-btn" data-frase="ULTRA RUNNER">ULTRA</button>
        <button class="frase-btn" data-frase="DUATLÓN">DUATLÓN</button>
      </div>
    </div>

    <div class="card">
      <div class="card-label">🌈 Color de acento</div>
      <div class="color-row" id="colorRow">
        <div class="color-swatch active" data-color="#00c96b" style="background:#00c96b"></div>
        <div class="color-swatch" data-color="#e63946" style="background:#e63946"></div>
        <div class="color-swatch" data-color="#3b82f6" style="background:#3b82f6"></div>
        <div class="color-swatch" data-color="#f59e0b" style="background:#f59e0b"></div>
        <div class="color-swatch" data-color="#a855f7" style="background:#a855f7"></div>
        <div class="color-swatch" data-color="#ec4899" style="background:#ec4899"></div>
        <div class="color-swatch" data-color="#ffffff" style="background:#fff;border:2px solid #444"></div>
      </div>
    </div>

    <!-- ── IMAGEN / LOGO ── -->
    <div class="card">
      <div class="card-label">🖼️ Logo de la carrera (opcional)</div>
      <input type="file" id="imgUpload" accept="image/*" style="display:none" />
      <button class="btn-upload-img" id="btnUpload">📁 Subir imagen o logo de la carrera…</button>
      <div id="imgPreviewArea" style="display:none">
        <div class="img-preview-row">
          <img id="imgThumb" alt="preview" />
          <div class="img-actions">
            <label class="logo-toggle">
              <input type="checkbox" id="chkLogo" />
              <span class="logo-toggle-label"><em class="chk-icon">✔</em>&nbsp;Es un logo — agregar al dorsal</span>
            </label>
            <button class="btn-clear-img" id="btnClearImg">✕ Quitar imagen</button>
          </div>
        </div>
        <div class="extracted-label">🎨 Colores de la imagen</div>
        <div class="color-row" id="extractedColors"></div>
      </div>
    </div>

  </div>
</div>

<footer>
  DorsalRun v1.0 · <a href="https://arielsavini.github.io">arielsavini.github.io</a>
</footer>

<script>
// ── STATE ──
let state = {
  numero: '42',
  nombre: 'ARIEL SAVINI',
  evento: 'TRAIL DE LOS ANDES',
  template: 'trail',
  accent: '#00c96b',
  frase: 'TRAIL RUNNER',
  logoImg: null,
  showLogo: false
};

const CANVAS_W = 400;
const CANVAS_H = 520;
const SCALE = 2; // retina

const mainCanvas = document.getElementById('dorsalCanvas');
mainCanvas.width  = CANVAS_W * SCALE;
mainCanvas.height = CANVAS_H * SCALE;
mainCanvas.style.width  = CANVAS_W + 'px';
mainCanvas.style.height = CANVAS_H + 'px';
const ctx = mainCanvas.getContext('2d');
ctx.scale(SCALE, SCALE);

// ── TEMPLATES ──
const templates = {

  trail: {
    draw(ctx, W, H, s) {
      const acc = s.accent;
      // BG
      const bg = ctx.createLinearGradient(0, 0, 0, H);
      bg.addColorStop(0, '#061a0c');
      bg.addColorStop(1, '#0d1f13');
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, W, H);

      // Mountain silhouette
      ctx.fillStyle = 'rgba(255,255,255,0.04)';
      ctx.beginPath();
      ctx.moveTo(0, H);
      ctx.lineTo(0, H * 0.72);
      ctx.lineTo(W * 0.15, H * 0.45);
      ctx.lineTo(W * 0.3, H * 0.62);
      ctx.lineTo(W * 0.5, H * 0.3);
      ctx.lineTo(W * 0.68, H * 0.52);
      ctx.lineTo(W * 0.82, H * 0.38);
      ctx.lineTo(W, H * 0.55);
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fill();

      // Top bar
      ctx.fillStyle = acc;
      ctx.fillRect(0, 0, W, 10);

      // Top stripe (thinner)
      ctx.fillStyle = hexAlpha(acc, 0.3);
      ctx.fillRect(0, 10, W, 4);

      // Bottom bar
      ctx.fillStyle = acc;
      ctx.fillRect(0, H - 10, W, 10);
      ctx.fillStyle = hexAlpha(acc, 0.3);
      ctx.fillRect(0, H - 14, W, 4);

      // Event name
      ctx.fillStyle = acc;
      ctx.font = 'bold 15px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '3px';
      fillText(ctx, s.evento.toUpperCase() || 'MI CARRERA', W / 2, 48, W - 40);

      // Number
      const numStr = String(s.numero || '0');
      const numSize = numStr.length <= 2 ? 200 : numStr.length === 3 ? 160 : numStr.length === 4 ? 130 : 104;
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${numSize}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      fillText(ctx, numStr, W / 2, H * 0.63, W - 40);

      // Divider line
      ctx.strokeStyle = hexAlpha(acc, 0.5);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(40, H * 0.72);
      ctx.lineTo(W - 40, H * 0.72);
      ctx.stroke();

      // Runner name
      ctx.fillStyle = '#e6edf3';
      ctx.font = 'bold 26px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      fillText(ctx, s.nombre.toUpperCase() || 'TU NOMBRE', W / 2, H * 0.84, W - 60);

      // Frase
      if (!(s.showLogo && s.logoImg)) {
        ctx.fillStyle = hexAlpha(acc, 0.6);
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.letterSpacing = '1px';
        ctx.textAlign = 'center';
        ctx.fillText(s.frase || 'TRAIL RUNNER', W / 2, H * 0.94);
      }
    }
  },

  road: {
    draw(ctx, W, H, s) {
      const acc = s.accent;
      // BG dark blue
      ctx.fillStyle = '#06101f';
      ctx.fillRect(0, 0, W, H);

      // Diagonal accent stripe
      ctx.save();
      ctx.fillStyle = hexAlpha(acc, 0.12);
      ctx.beginPath();
      ctx.moveTo(0, H * 0.55);
      ctx.lineTo(W, H * 0.25);
      ctx.lineTo(W, H * 0.45);
      ctx.lineTo(0, H * 0.75);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Horizontal lines (racing style)
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = hexAlpha(acc, 0.07 + i * 0.01);
        ctx.fillRect(0, H * 0.78 + i * 8, W, 4);
      }

      // Top accent bar
      ctx.fillStyle = acc;
      ctx.fillRect(0, 0, W, 12);

      // Bottom bar
      ctx.fillStyle = acc;
      ctx.fillRect(0, H - 12, W, 12);

      // Event name tag (badge)
      const tagW = 200;
      const tagH = 28;
      const tagX = (W - tagW) / 2;
      ctx.fillStyle = acc;
      ctx.beginPath();
      ctx.roundRect(tagX, 28, tagW, tagH, 4);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = 'bold 12px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      fillText(ctx, s.evento.toUpperCase() || 'MI CARRERA', W / 2, 47, tagW - 16);

      // Number
      const numStr = String(s.numero || '0');
      const numSize = numStr.length <= 2 ? 200 : numStr.length === 3 ? 158 : numStr.length === 4 ? 128 : 102;
      ctx.fillStyle = '#ffffff';
      ctx.font = `900 ${numSize}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      fillText(ctx, numStr, W / 2, H * 0.62, W - 40);

      // Thin line
      ctx.strokeStyle = hexAlpha(acc, 0.4);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(40, H * 0.70);
      ctx.lineTo(W - 40, H * 0.70);
      ctx.stroke();

      // Runner name
      ctx.fillStyle = '#e6edf3';
      ctx.font = 'bold 26px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      fillText(ctx, s.nombre.toUpperCase() || 'TU NOMBRE', W / 2, H * 0.83, W - 60);

      if (!(s.showLogo && s.logoImg)) {
        ctx.fillStyle = hexAlpha(acc, 0.7);
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.letterSpacing = '1px';
        ctx.textAlign = 'center';
        ctx.fillText(s.frase || 'RUNNING', W / 2, H * 0.93);
      }
    }
  },

  ultra: {
    draw(ctx, W, H, s) {
      const acc = s.accent;
      // BG black
      ctx.fillStyle = '#080808';
      ctx.fillRect(0, 0, W, H);

      // Corner triangles
      ctx.fillStyle = hexAlpha(acc, 0.15);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(W*0.45,0); ctx.lineTo(0,H*0.35); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(W,H); ctx.lineTo(W-W*0.45,H); ctx.lineTo(W,H-H*0.35); ctx.closePath(); ctx.fill();

      // Accent diagonal bar
      ctx.save();
      ctx.fillStyle = acc;
      ctx.beginPath();
      ctx.moveTo(0, H * 0.68);
      ctx.lineTo(W, H * 0.42);
      ctx.lineTo(W, H * 0.46);
      ctx.lineTo(0, H * 0.72);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      // Top thick bar
      ctx.fillStyle = acc;
      ctx.fillRect(0, 0, W, 14);
      ctx.fillRect(0, H - 14, W, 14);

      // Event name
      ctx.fillStyle = acc;
      ctx.font = 'bold 14px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '4px';
      fillText(ctx, s.evento.toUpperCase() || 'MI CARRERA', W / 2, 50, W - 40);

      // Number
      const numStr = String(s.numero || '0');
      const numSize = numStr.length <= 2 ? 210 : numStr.length === 3 ? 165 : numStr.length === 4 ? 130 : 104;
      ctx.fillStyle = acc;
      ctx.font = `900 ${numSize}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      fillText(ctx, numStr, W / 2, H * 0.63, W - 40);

      // Runner name (below diagonal)
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 26px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '3px';
      fillText(ctx, s.nombre.toUpperCase() || 'TU NOMBRE', W / 2, H * 0.83, W - 60);

      if (!(s.showLogo && s.logoImg)) {
        ctx.fillStyle = hexAlpha(acc, 0.7);
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.letterSpacing = '1px';
        ctx.textAlign = 'center';
        ctx.fillText(s.frase || 'ULTRA RUNNER', W / 2, H * 0.93);
      }
    }
  },

  clasico: {
    draw(ctx, W, H, s) {
      const acc = s.accent;
      // BG white
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);

      // Outer border frame
      ctx.strokeStyle = acc;
      ctx.lineWidth = 12;
      ctx.strokeRect(6, 6, W - 12, H - 12);

      // Inner border
      ctx.strokeStyle = hexAlpha(acc, 0.3);
      ctx.lineWidth = 2;
      ctx.strokeRect(18, 18, W - 36, H - 36);

      // Top area
      ctx.fillStyle = acc;
      ctx.fillRect(18, 18, W - 36, 52);

      // Event name
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '3px';
      fillText(ctx, s.evento.toUpperCase() || 'MI CARRERA', W / 2, 50, W - 60);

      // Number
      const numStr = String(s.numero || '0');
      const numSize = numStr.length <= 2 ? 200 : numStr.length === 3 ? 160 : numStr.length === 4 ? 125 : 100;
      ctx.fillStyle = acc;
      ctx.font = `900 ${numSize}px Inter, sans-serif`;
      ctx.textAlign = 'center';
      fillText(ctx, numStr, W / 2, H * 0.63, W - 40);

      // Divider
      ctx.strokeStyle = hexAlpha(acc, 0.4);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(40, H * 0.71);
      ctx.lineTo(W - 40, H * 0.71);
      ctx.stroke();

      // Runner name
      ctx.fillStyle = '#111111';
      ctx.font = 'bold 26px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.letterSpacing = '2px';
      fillText(ctx, s.nombre.toUpperCase() || 'TU NOMBRE', W / 2, H * 0.83, W - 60);

      if (!(s.showLogo && s.logoImg)) {
        ctx.fillStyle = hexAlpha(acc, 0.6);
        ctx.font = 'bold 11px Inter, sans-serif';
        ctx.letterSpacing = '1px';
        ctx.textAlign = 'center';
        ctx.fillText(s.frase || 'RUNNING', W / 2, H * 0.93);
      }
    }
  }
};

// ── HELPERS ──
function hexAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function fillText(ctx, text, x, y, maxWidth) {
  // Shrink font if text too wide
  const saved = ctx.font;
  let size = parseInt(ctx.font);
  while (ctx.measureText(text).width > maxWidth && size > 8) {
    size--;
    ctx.font = ctx.font.replace(/\d+px/, size + 'px');
  }
  ctx.fillText(text, x, y, maxWidth);
  ctx.font = saved;
}

// ── LOGO ON DORSAL ──
function drawLogo(ctx, W, H, img) {
  const maxW = 120;
  const maxH = 42;
  const ratio = Math.min(maxW / img.naturalWidth, maxH / img.naturalHeight);
  const lw = img.naturalWidth * ratio;
  const lh = img.naturalHeight * ratio;
  // Centered horizontally, just below runner name (in the frase slot)
  const x = (W - lw) / 2;
  const y = H * 0.878;
  ctx.save();
  ctx.globalAlpha = 0.92;
  ctx.drawImage(img, x, y, lw, lh);
  ctx.restore();
}

// ── COLOR EXTRACTION ──
function extractColors(img, count = 7) {
  const SIZE = 80;
  const c = document.createElement('canvas');
  c.width = SIZE; c.height = SIZE;
  const cx = c.getContext('2d');
  cx.drawImage(img, 0, 0, SIZE, SIZE);
  const data = cx.getImageData(0, 0, SIZE, SIZE).data;
  const buckets = {};
  for (let i = 0; i < data.length; i += 16) { // cada 4 píxeles
    const a = data[i + 3];
    if (a < 128) continue;
    const r = Math.round(data[i]   / 24) * 24;
    const g = Math.round(data[i+1] / 24) * 24;
    const b = Math.round(data[i+2] / 24) * 24;
    const bright = (r + g + b) / 3;
    if (bright > 235 || bright < 20) continue; // skip near-white / near-black
    const sat = Math.max(r,g,b) - Math.min(r,g,b);
    if (sat < 28) continue; // skip grey/neutral
    const key = `${r},${g},${b}`;
    buckets[key] = (buckets[key] || 0) + 1;
  }
  return Object.entries(buckets)
    .sort((a, b) => b[1] - a[1])
    .slice(0, count)
    .map(([key]) => {
      const [r, g, b] = key.split(',').map(Number);
      return '#' + r.toString(16).padStart(2,'0')
                 + g.toString(16).padStart(2,'0')
                 + b.toString(16).padStart(2,'0');
    });
}

// ── DRAW ──
function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  templates[state.template].draw(ctx, CANVAS_W, CANVAS_H, state);
  if (state.showLogo && state.logoImg) drawLogo(ctx, CANVAS_W, CANVAS_H, state.logoImg);
}

// ── THUMBNAILS ──
function drawThumbnail(tplKey) {
  const c = document.getElementById('prev-' + tplKey);
  const tc = c.getContext('2d');
  const TW = 80, TH = 100;
  tc.save();
  tc.scale(TW / CANVAS_W, TH / CANVAS_H);
  templates[tplKey].draw(tc, CANVAS_W, CANVAS_H, state);
  if (state.showLogo && state.logoImg && tplKey === state.template) {
    drawLogo(tc, CANVAS_W, CANVAS_H, state.logoImg);
  }
  tc.restore();
}

function drawAllThumbnails() {
  Object.keys(templates).forEach(drawThumbnail);
}

// ── INPUTS ──
document.getElementById('inpNumero').addEventListener('input', e => {
  state.numero = e.target.value.slice(0, 5);
  draw();
});
document.getElementById('inpNombre').addEventListener('input', e => {
  state.nombre = e.target.value;
  draw();
});
document.getElementById('inpEvento').addEventListener('input', e => {
  state.evento = e.target.value;
  draw();
});

// Frase
document.getElementById('fraseRow').addEventListener('click', e => {
  const btn = e.target.closest('.frase-btn');
  if (!btn) return;
  document.querySelectorAll('.frase-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.frase = btn.dataset.frase;
  draw();
  drawAllThumbnails();
});

// Templates
document.getElementById('templatesGrid').addEventListener('click', e => {
  const btn = e.target.closest('.tpl-btn');
  if (!btn) return;
  document.querySelectorAll('.tpl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  state.template = btn.dataset.tpl;
  draw();
});

// Colors
document.getElementById('colorRow').addEventListener('click', e => {
  const sw = e.target.closest('.color-swatch');
  if (!sw) return;
  document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
  sw.classList.add('active');
  state.accent = sw.dataset.color;
  draw();
  drawAllThumbnails();
});

// ── IMAGE / LOGO HANDLERS ──
const imgUpload    = document.getElementById('imgUpload');
const btnUpload    = document.getElementById('btnUpload');
const imgPreviewArea = document.getElementById('imgPreviewArea');
const imgThumb     = document.getElementById('imgThumb');
const chkLogo      = document.getElementById('chkLogo');
const btnClearImg  = document.getElementById('btnClearImg');
const extractedColors = document.getElementById('extractedColors');

btnUpload.addEventListener('click', () => imgUpload.click());

imgUpload.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      // thumbnail preview
      imgThumb.src = ev.target.result;
      state.logoImg = img;

      // extract colors
      const colors = extractColors(img);
      extractedColors.innerHTML = '';
      if (colors.length === 0) {
        extractedColors.innerHTML = '<span class="no-colors-msg">No se detectaron colores vivos.</span>';
      } else {
        colors.forEach((hex, i) => {
          const sw = document.createElement('div');
          sw.className = 'color-swatch' + (i === 0 ? ' active' : '');
          sw.dataset.color = hex;
          sw.style.cssText = `background:${hex}`;
          if (i === 0) {
            // auto-apply first extracted color as accent
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            sw.classList.add('active');
            state.accent = hex;
          }
          extractedColors.appendChild(sw);
        });
        // delegate click to extractedColors row
      }

      imgPreviewArea.style.display = '';
      // Auto-activate the logo on the dorsal when an image is uploaded
      chkLogo.checked = true;
      state.showLogo = true;
      draw();
      drawAllThumbnails();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  imgUpload.value = ''; // allow re-upload same file
});

// clicks on extracted color swatches
extractedColors.addEventListener('click', e => {
  const sw = e.target.closest('.color-swatch');
  if (!sw) return;
  document.querySelectorAll('#colorRow .color-swatch, #extractedColors .color-swatch')
    .forEach(s => s.classList.remove('active'));
  sw.classList.add('active');
  state.accent = sw.dataset.color;
  draw();
  drawAllThumbnails();
});

chkLogo.addEventListener('change', () => {
  state.showLogo = chkLogo.checked;
  draw();
  drawAllThumbnails();
});

btnClearImg.addEventListener('click', () => {
  state.logoImg = null;
  state.showLogo = false;
  chkLogo.checked = false;
  imgThumb.src = '';
  extractedColors.innerHTML = '';
  imgPreviewArea.style.display = 'none';
  draw();
  drawAllThumbnails();
});

// Download
document.getElementById('btnDownload').addEventListener('click', () => {
  draw(); // ensure canvas reflects current state before export
  const link = document.createElement('a');
  const safe = (s) => s.replace(/[^a-zA-Z0-9]/g, '_').toLowerCase();
  link.download = `dorsal_${safe(state.numero)}_${safe(state.nombre)}.png`;
  link.href = mainCanvas.toDataURL('image/png');
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
});

// ── INIT ──
document.fonts.ready.then(() => {
  draw();
  drawAllThumbnails();
});

// SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
